[project]
name = "evalbench"
version = "0.1.0"
description = "Provider-agnostic LLM evaluation engine"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "asyncpg>=0.31.0",
    "click>=8.4.2",
    "pydantic>=2.13.4",
    "pyyaml>=6.0.3",
    "redis>=8.1.0",
    "snowballstemmer>=3.1.1",
]

[project.optional-dependencies]
openai = ["openai>=1.0"]
anthropic = ["anthropic>=0.40"]
gemini = ["google-genai>=0.3"]
backend = ["asyncpg>=0.31.0", "redis>=8.1.0"]
all = ["openai>=1.0", "anthropic>=0.40", "google-genai>=0.3", "asyncpg>=0.31.0", "redis>=8.1.0"]

[project.scripts]
evalbench = "evalbench.cli:cli"
